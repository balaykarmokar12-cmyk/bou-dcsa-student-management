<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOU DCSA - Student Management System</title>
<style>
:root{--primary:#0d47a1;--secondary:#1976d2;--bg:#f4f7fb}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg)}
.header{background:var(--primary);color:#fff;padding:15px 25px;display:flex;align-items:center;justify-content:space-between}
.logo-area{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;background:#fff;color:var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px}
.header h1{font-size:20px} .header p{font-size:12px;opacity:.9}
.container{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:320px 1fr;gap:20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.card h3{margin-bottom:15px;color:var(--primary);border-left:4px solid var(--primary);padding-left:10px}
input,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}
.btn{width:100%;padding:11px;background:var(--secondary);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primary)}
.search-box{margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#e3f2fd}
.action-btn{padding:5px 8px;border:0;border-radius:5px;cursor:pointer;margin-right:4px}
.del{background:#ffcdd2;color:#c62828} .edit{background:#c8e6c9;color:#2e7d32}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat h2{color:var(--primary)}
@media(max-width:800px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="logo-area">
    <div class="logo">BOU</div>
    <div><h1>Student Management System</h1><p>DCSA 3304 Project - 251 Term</p></div>
  </div>
  <div style="text-align:right;font-size:12px">ID: Your ID<br>balaykarmokar12</div>
</div>

<div class="container">
  <div>
    <div class="card">
      <h3>Add New Student</h3>
      <input id="name" placeholder="Student Name">
      <input id="roll" placeholder="Roll No">
      <select id="cls"><option>Class 9</option><option>Class 10</option><option>DCSA</option><option>HSC</option></select>
      <input id="phone" placeholder="Phone Number">
      <input id="gpa" placeholder="GPA / Result">
      <button class="btn" onclick="addStudent()">+ Add Student</button>
    </div>
  </div>

  <div>
    <div class="stats">
      <div class="stat"><h2 id="total">0</h2><p>Total Student</p></div>
      <div class="stat"><h2 id="present">0</h2><p>Present Today</p></div>
      <div class="stat"><h2>DCSA</h2><p>Project 2025</p></div>
    </div>

    <div class="card">
      <h3>Student List</h3>
      <input class="search-box" id="search" placeholder="Search by Name or Roll..." onkeyup="render()">
      <table>
        <thead><tr><th>Roll</th><th>Name</th><th>Class</th><th>Action</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <br><button class="btn" style="background:#333" onclick="window.print()">Print / PDF Save</button>
    </div>
  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('bou_students')||'[]');
function addStudent(){
  let s={name:name.value,roll:roll.value,cls:cls.value,phone:phone.value,gpa:gpa.value,id:Date.now()};
  if(!s.name||!s.roll) return alert('Name & Roll Required');
  students.push(s); localStorage.setItem('bou_students',JSON.stringify(students));
  name.value=roll.value=phone.value=gpa.value=''; render();
}
function delStudent(id){students=students.filter(x=>x.id!=id);localStorage.setItem('bou_students',JSON.stringify(students));render();}
function render(){
  let q=search.value.toLowerCase(); let filtered=students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q));
  list.innerHTML=filtered.map(s=>`<tr><td>${s.roll}</td><td>${s.name}<br><small>${s.phone}</small></td><td>${s.cls}</td><td><button class='action-btn del' onclick='delStudent(${s.id})'>Del</button></td></tr>`).join('');
  total.innerText=students.length; present.innerText=students.length;
}
render();
</script>
</body>
</html>
